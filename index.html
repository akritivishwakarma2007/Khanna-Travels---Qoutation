<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khanna Travels — Travel Insurance Quote Comparison</title>
  <meta name="description" content="Khanna Travels — Compare travel insurance premiums across all insurers and plans. Enter trip details and get instant quotes grouped by coverage amount.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/quote.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body>

  <!-- ── DB Status Banner ────────────────────────────────────────────────── -->
  <div class="db-banner" id="dbBanner"></div>

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header class="app-header" role="banner">

    <!-- Logo -->
    <div class="header-logo" aria-label="Khanna Travels">
      <img src="logo.png" alt="Khanna Travels" class="header-logo-img">
    </div>

    <div class="header-divider" aria-hidden="true"></div>

    <!-- Navigation -->
    <nav class="header-nav" role="navigation" aria-label="Main navigation">
      <button class="nav-btn active" data-view="quote" id="navQuote" aria-current="page">
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M10 2a8 8 0 100 16A8 8 0 0010 2zm1 5a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V7z" clip-rule="evenodd"/>
        </svg>
        Insurance Quote
      </button>
      <button class="nav-btn" data-view="visa" id="navVisa">
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M12.586 4.586a2 2 0 112.828 2.828l-3 3a2 2 0 01-2.828 0 1 1 0 00-1.414 1.414 4 4 0 005.656 0l3-3a4 4 0 00-5.656-5.656l-1.5 1.5a1 1 0 101.414 1.414l1.5-1.5zm-5 5a2 2 0 012.828 0 1 1 0 101.414-1.414 4 4 0 00-5.656 0l-3 3a4 4 0 105.656 5.656l1.5-1.5a1 1 0 10-1.414-1.414l-1.5 1.5a2 2 0 11-2.828-2.828l3-3z" clip-rule="evenodd"/>
        </svg>
        Visa Links
      </button>
      <button class="nav-btn" data-view="admin" id="navAdmin" style="display:none;">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path d="M4 4a2 2 0 012-2h8a2 2 0 012 2v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"/></svg>
        Insurance Plans &amp; Rates
      </button>
    </nav>

    <!-- Agent label -->
    <div class="header-agent" id="agentLabel" aria-label="Current agent">
      <div class="agent-avatar" aria-hidden="true">KT</div>
      <span>Khanna Agent</span>
    </div>

  </header>

  <!-- ── Main app content ────────────────────────────────────────────────── -->
  <main id="app" role="main" aria-live="polite">
    <!-- Rendered by app.js router -->
  </main>

  <!-- ── Toast Notifications ────────────────────────────────────────────── -->
  <div class="toast-container" id="toastContainer" aria-live="assertive" aria-atomic="true"></div>

  <!-- ── Libraries ───────────────────────────────────────────────────────── -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <!-- ── App Bootstrap ───────────────────────────────────────────────────── -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
