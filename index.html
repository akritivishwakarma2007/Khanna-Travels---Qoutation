<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khanna Travels — Travel Insurance Quote Comparison</title>
  <meta name="description"
    content="Khanna Travels — Compare travel insurance premiums across all insurers and plans. Enter trip details and get instant quotes grouped by coverage amount.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/quote.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/print.css">
</head>

<body>

  <!-- ── DB Status Banner ────────────────────────────────────────────────── -->
  <div class="db-banner" id="dbBanner"></div>

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header class="app-header" role="banner">

    <!-- Logo Band (Top) -->
    <div class="header-logo-band">
      <div class="header-logo" aria-label="Khanna Travels">
        <img src="logo.png" alt="Khanna Travels" class="header-logo-img">
        <div class="header-logo-text">
          <div class="logo-title"><span class="logo-khanna">KHANNA</span> <span class="logo-travels">TRAVELS</span></div>
          <div class="logo-subtitle">HOLIDAYS REDEFINED</div>
        </div>
      </div>

      <!-- Agent / Auth Area -->
      <div class="header-agent" id="agentLabel" aria-label="Current agent">
        <!-- Dynamically rendered by app.js based on auth state -->
      </div>
    </div>

    <!-- Navbar directly below logo band (PC: 56px tall, 1px borders top and bottom; hidden on mobile) -->
    <nav class="header-navbar" id="desktopNavbar" role="navigation" aria-label="Main navigation">
      <div class="navbar-container">
        <button class="nav-btn active" data-view="quote" id="navQuote" aria-current="page">
          <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
            <path fill-rule="evenodd"
              d="M10 2a8 8 0 100 16A8 8 0 0010 2zm1 5a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V7z"
              clip-rule="evenodd" />
          </svg>
          <span>Insurance Quotation</span>
        </button>
        <button class="nav-btn" data-view="visa" id="navVisa">
          <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
            <path fill-rule="evenodd"
              d="M12.586 4.586a2 2 0 112.828 2.828l-3 3a2 2 0 01-2.828 0 1 1 0 00-1.414 1.414 4 4 0 005.656 0l3-3a4 4 0 00-5.656-5.656l-1.5 1.5a1 1 0 101.414 1.414l1.5-1.5zm-5 5a2 2 0 012.828 0 1 1 0 101.414-1.414 4 4 0 00-5.656 0l-3 3a4 4 0 105.656 5.656l1.5-1.5a1 1 0 10-1.414-1.414l-1.5 1.5a2 2 0 11-2.828-2.828l3-3z"
              clip-rule="evenodd" />
          </svg>
          <span>Visa Links</span>
        </button>
        <button class="nav-btn admin-only-item" data-view="admin" id="navAdmin" style="display:none;">
          <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
            <path d="M4 4a2 2 0 012-2h8a2 2 0 012 2v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z" />
          </svg>
          <span>Insurance Plans &amp; Rates</span>
        </button>
        <button class="nav-btn admin-only-item" data-view="settings" id="navSettings" style="display:none;">
          <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
            <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
          </svg>
          <span>Settings</span>
        </button>
      </div>
    </nav>

  </header>

  <!-- ── Main app content ────────────────────────────────────────────────── -->
  <main id="app" role="main" aria-live="polite">
    <!-- Rendered by app.js router -->
  </main>

  <!-- ── Small Footer ────────────────────────────────────────────────────── -->
  <footer class="app-footer">
    <p>© Khanna Travels • Holidays Redefined</p>
  </footer>

  <!-- ── Mobile Bottom Tab Bar ────────────────────────────────────────────── -->
  <nav class="mobile-bottom-nav" id="mobileBottomNav" role="navigation" aria-label="Mobile Navigation">
    <button class="mobile-tab-btn active" data-view="quote" id="mobNavQuote" aria-label="Insurance Quotation" aria-current="page">
      <svg class="mobile-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span class="mobile-tab-label">Quote</span>
    </button>
    <button class="mobile-tab-btn" data-view="visa" id="mobNavVisa" aria-label="Visa Links">
      <svg class="mobile-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
      <span class="mobile-tab-label">Visa Links</span>
    </button>
    <button class="mobile-tab-btn admin-only-item" data-view="admin" id="mobNavAdmin" style="display:none;" aria-label="Plans & Rates">
      <svg class="mobile-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <line x1="3" y1="9" x2="21" y2="9"/>
        <line x1="9" y1="21" x2="9" y2="9"/>
      </svg>
      <span class="mobile-tab-label">Plans</span>
    </button>
    <button class="mobile-tab-btn admin-only-item" data-view="settings" id="mobNavSettings" style="display:none;" aria-label="Settings">
      <svg class="mobile-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span class="mobile-tab-label">Settings</span>
    </button>
  </nav>

  <!-- ── Toast Notifications ────────────────────────────────────────────── -->
  <div class="toast-container" id="toastContainer" aria-live="assertive" aria-atomic="true"></div>

  <!-- ── Libraries ───────────────────────────────────────────────────────── -->
  <script src="js/vendor/html2canvas.min.js"></script>

  <!-- ── App Bootstrap ───────────────────────────────────────────────────── -->
  <script type="module" src="js/app.js"></script>

</body>

</html>
